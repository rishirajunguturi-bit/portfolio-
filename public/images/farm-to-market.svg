  <circle cx="76" cy="62" r="5" fill="#EF4444"/>
  <circle cx="94" cy="62" r="5" fill="#F59E0B"/>
  <circle cx="112" cy="62" r="5" fill="#10B981"/>
  <rect x="150" y="52" width="280" height="20" rx="6" fill="#27272A"/>
  <text x="162" y="66" fill="#A1A1AA" font-family="monospace" font-size="11">farm-market-direct.org/portal</text>

  <!-- Left Map / Route Logistics Card -->
  <rect x="75" y="105" width="350" height="330" rx="10" fill="#141418" stroke="#27272A"/>
