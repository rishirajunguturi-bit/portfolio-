  <!-- Map Graphic Elements -->
  <rect x="95" y="155" width="310" height="255" rx="8" fill="#0D0D10" stroke="#1F1F24"/>
  <!-- Map Route Line -->
  <path d="M130 350 Q 200 240 250 280 T 360 180" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  
  <!-- Nodes -->
  <circle cx="130" cy="350" r="12" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="2"/>
