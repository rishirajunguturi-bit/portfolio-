  <rect x="475" y="255" width="55" height="55" rx="6" fill="#7C3AED" fill-opacity="0.15"/>
  <text x="540" y="272" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="600">Fresh Produce Lot</text>
  <text x="540" y="290" fill="#A1A1AA" font-family="sans-serif" font-size="11">Direct Logistics Pool</text>
  <text x="540" y="308" fill="#7C3AED" font-family="sans-serif" font-size="12" font-weight="700">Verified Listing</text>

  <!-- Logistics Status Pill -->
  <rect x="465" y="335" width="240" height="40" rx="6" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="1"/>
  <text x="480" y="360" fill="#F5F5F5" font-family="sans-serif" font-size="11">Shared Logistics Route: Active</text>
