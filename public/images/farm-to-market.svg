  <text x="110" y="380" fill="#A1A1AA" font-family="sans-serif" font-size="10">Farmer Hub</text>

  <circle cx="250" cy="280" r="10" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="2"/>
  <text x="246" y="284" fill="#F59E0B" font-family="sans-serif" font-size="9" font-weight="700">B</text>

  <circle cx="360" cy="180" r="14" fill="#7C3AED" fill-opacity="0.3" stroke="#7C3AED" stroke-width="2"/>
  <text x="356" y="184" fill="#7C3AED" font-family="sans-serif" font-size="11" font-weight="700">C</text>
  <text x="330" y="158" fill="#A1A1AA" font-family="sans-serif" font-size="10">Wholesale Market</text>

