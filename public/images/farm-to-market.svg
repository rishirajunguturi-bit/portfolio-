  <text x="465" y="135" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="600">Produce Marketplace</text>

  <!-- Product Item 1 -->
  <rect x="465" y="155" width="240" height="75" rx="8" fill="#1A1A20" stroke="#27272A"/>
  <rect x="475" y="165" width="55" height="55" rx="6" fill="#10B981" fill-opacity="0.15"/>
  <path d="M495 185 L510 200 L500 200 Z" fill="#10B981"/>
  <text x="540" y="182" fill="#F5F5F5" font-family="sans-serif" font-size="13" font-weight="600">Organic Paddy Grain</text>
  <text x="540" y="200" fill="#A1A1AA" font-family="sans-serif" font-size="11">Grade A • 500 kg available</text>
  <text x="540" y="218" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">Direct Producer Rate</text>

  <!-- Product Item 2 -->
